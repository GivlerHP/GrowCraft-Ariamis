buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
    }
    dependencies {
        classpath ('com.anatawa12.forge:ForgeGradle:1.2-1.1.+') {
            changing = true
        }
    }
}

apply plugin: "forge"
apply plugin: "checkstyle"

checkstyle {
    toolVersion = "6.11.2"
    configDirectory.set(file("$rootDir/checkstyle"))
    configFile = new File(rootDir, "checkstyle/checkstyle.xml")
}

sourceCompatibility = JavaVersion.VERSION_1_7
targetCompatibility = JavaVersion.VERSION_1_7

version = "${minecraft_version}-${growthcraft_version}"
group = "mod.growthcraft"
archivesBaseName = "growthcraft"

ext.growthcraftApi = "src/main/java/growthcraft/api"
ext.forestryApiRoot = "api/ForestryAPI"

class StructExtApi {
    String name
    String api
    String exclusion
    String root = api
}

ext.thaumcraftApi = "api/thaumcraft/api"

StructExtApi[] apis = [
    new StructExtApi(name: "buildcraft", api: "api/buildcraft/api", exclusion: "**/buildcraft/api/meh"),
    new StructExtApi(name: "forestry", api: "api/ForestryAPI/forestry/api", exclusion: "**/forestry/api/**", root: ext.forestryApiRoot),
    new StructExtApi(name: "invtweaks", api: "api/invtweaks/api", exclusion: "**/invtweaks/api/**"),
    new StructExtApi(name: "mfr", api: "api/powercrystals/minefactoryreloaded/api", exclusion: "**/powercrystals/minefactoryreloaded/api/**"),
    new StructExtApi(name: "thaumcraft", api: ext.thaumcraftApi, exclusion: "**/thaumcraft/api/**"),
    new StructExtApi(name: "waila", api: "api/mcp/mobius/waila/api", exclusion: "**/mcp/mobius/waila/api/**")
]

minecraft {
    version = minecraft_forge_version
    runDir = "run"
    replace "@VERSION@", project.version
    replace "@GRC_MC_VERSION@", minecraft_version
    replace "@GRC_VERSION@", growthcraft_version
}

sourceSets {
    api {
        java {
            srcDir project.growthcraftApi
            for (StructExtApi entry in apis) {
                srcDir entry.api
            }
        }
    }
    main {
        java {
            // Growthcraft's public API is compiled by the dedicated api
            // source set and then bundled into the complete jar once.
            exclude "growthcraft/api/**"
        }
        compileClasspath += sourceSets.api.output
        runtimeClasspath += sourceSets.api.output
    }
    test {
        compileClasspath += sourceSets.api.output
        runtimeClasspath += sourceSets.api.output
    }
}

processResources {
    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version
    from(sourceSets.main.resources.srcDirs) {
        include "mcmod.info"
        expand "version":project.version, "mcversion":project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude "mcmod.info"
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name "applecore"
        url "https://www.ryanliptak.com/maven/"
    }
    maven {
        name "chickenbones"
        url "https://chickenbones.net/maven/"
    }
    maven {
        name = "forge"
        url = "https://maven.minecraftforge.net/"
    }
 
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
    }
}

dependencies {
    implementation "applecore:AppleCore:${minecraft_version}-${applecore_version}:api"
    //implementation "mcp.mobius.waila:Waila:${waila_version}_${minecraft_version}:dev"
    implementation "codechicken:CodeChickenLib:${minecraft_version}-${code_chicken_lib_version}:dev"
    implementation "codechicken:CodeChickenCore:${minecraft_version}-${code_chicken_core_version}:dev"
    implementation "codechicken:NotEnoughItems:${minecraft_version}-${nei_version}:dev"
    implementation "curse.maven:thaumcraft-223628:2227552"
    implementation "curse.maven:forestry-59751:2333823"
    //implementation "com.mod-buildcraft:buildcraft:${bc_version}:dev"
    implementation "curse.maven:buildcraft-61811:2322106"
    testImplementation "junit:junit:4.11"
    implementation files('libs/MoreBeyondOrdinary-1.7.1-deobf.jar') //geckolib-unofficial-1.7.10-1.0.3-dev
    implementation files('libs/geckolib-unofficial-1.7.10-1.0.3-dev.jar')
    implementation files('libs/MF2-2.10.8.1-deobf.jar')
}

runClient {
    if( project.hasProperty("mcUsername") && project.hasProperty("mcPassword") ) {
        args "--username=${project.mcUsername}"
        args "--password=${project.mcPassword}"
    }
}

debugClient {
    if( project.hasProperty("mcUsername") && project.hasProperty("mcPassword") ) {
        args "--username=${project.mcUsername}"
        args "--password=${project.mcPassword}"
    }
}

tasks.withType(JavaCompile) {
    options.compilerArgs += ["-Xlint:all", "-Xlint:deprecation", "-Xlint:rawtypes", "-Xlint:unchecked"]
    options.deprecation = true
    options.encoding = "utf8"
}

task sourceJar(type: Jar) {
    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE
    from sourceSets.main.allSource
    from(sourceSets.api.allSource) {
        for (StructExtApi entry in apis) {
            exclude entry.exclusion
        }
    }
    archiveClassifier.set("sources")
}

javadoc {
    source += sourceSets.api.allSource
    for (StructExtApi entry in apis) {
        exclude entry.exclusion
    }
    failOnError = false
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    archiveClassifier.set("javadoc")
    from "build/docs/javadoc"
}

task deobfJar(type: Jar) {
    from sourceSets.main.output
    from(sourceSets.api.output) {
        for (StructExtApi api in apis) {
            exclude api.exclusion
        }
    }
    archiveClassifier.set("deobf")
}

task apiJar(type: Jar) {
    from(sourceSets.api.output) {
        for (StructExtApi api in apis) {
            exclude api.exclusion
        }
    }
    archiveClassifier.set("api")
}

jar {
    archiveClassifier.set("complete")
    from(sourceSets.api.output) {
        for (StructExtApi api in apis) {
            exclude api.exclusion
        }
    }
    into("thaumcraft/api") {
        from project.thaumcraftApi + "/LICENSE"
    }
    into("forestry/api") {
        from project.forestryApiRoot + "/LICENSE.txt"
    }
}

build.dependsOn sourceJar, javadocJar, deobfJar, apiJar
